<!DOCTYPE html>
<html>
  <head>
    <title>Mindustry Web Build</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web port of the game Mindustry, with as many features as possible.">
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        position: relative; 
        overflow-x: hidden; 
      }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; 
        background: url('background.png') center / cover no-repeat;
        filter: blur(8px);
        transform: scale(1.1); 
      }

    </style>
    <script src="https://cdn.jsdelivr.net/gh/khoichon/cardpopup/popup.js"></script>
  </head>
  <body>
    <script>
      openCard(`
        <div style="padding: 24px 32px; border-radius: 16px; background: white; box-shadow: 0 20px 50px rgba(0,0,0,.25);">
          <p>As you can tell, the main page disappeared.</p>
          <p>We are working on revamping the main page so that it no longer looks like AI slop.</p>
          <p style="color: gray">(Because the new version is written by an actual human.)</p>
          <p>Meanwhile, here are all the links to the files:</p>
          <p>Offline (latest) mode:</p>
          <ul>
            <li><a href="https://github.com/khoichon/mindustry-web/releases/latest/download/mindustry-offline.html" download class="cta primary">Download HTML</a></li>
            <li><a href="https://github.com/khoichon/mindustry-web/releases/latest/download/mindustry-offline.zip" download class="cta secondary">Download .zip file (for web hosting)</a></li>
            <li><a href="./offlinemode/build/" class="cta secondary">View offline build directly (bleeding-edge builds)</a></li>
          </ul>
          <br>
          <a href="./onlinemode/">Legacy (CheerpJ + shims) build</a>

        </div>
      `, {
        angle: -8,
        closeOnOverlay: false
      });
    </script>
  </body>
</html>
