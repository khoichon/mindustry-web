# Points Gradle at a specific JDK to *run* Gradle itself, independent of
# whatever `java` is first on PATH. Needed because Gradle can't run on
# JDK 25 yet (fails with "Unsupported class file major version 69" while
# parsing build scripts) -- this is unrelated to backend-teavm's own
# sourceCompatibility=11 target, which stays as-is.
#
# Set this to wherever a JDK 17 or 21 install lives on your machine, e.g.:
#   macOS (Homebrew):     /opt/homebrew/opt/openjdk@21
#   macOS (sdkman):       ~/.sdkman/candidates/java/21.x.x-tem
#   Linux (apt):          /usr/lib/jvm/java-21-openjdk-amd64
#   Windows:               C:/Program Files/Java/jdk-21
org.gradle.java.home=/Users/chon/.sdkman/candidates/java/21.0.5-tem

# Mindustry's annotation processors use javac internals at runtime
# (Selement/AnnotationProxyMaker cast to com.sun.tools.javac.* types), which
# JPMS blocks by default. Compilation runs in-process in this daemon, so the
# opens have to live here -- same list Mindustry's own gradle.properties
# carries. Without it the processors die with InaccessibleObjectException the
# first time they inspect an annotation.
org.gradle.jvmargs=--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED
